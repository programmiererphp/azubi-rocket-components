name: C12 isolated and published browser tests
on:
  push:
    branches: [main]
    paths:
      - 'components/C12-application-pack/src/**'
      - 'components/C12-application-pack/dist/**'
      - 'components/C12-application-pack/demo/**'
      - 'components/C12-application-pack/tests/**'
      - 'components/C12-application-pack/fixtures/**'
      - 'components/C12-application-pack/build.mjs'
      - 'components/C12-application-pack/package.json'
      - '.github/workflows/C12-browser.yml'
      - 'services/application-files/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        working-directory: components/C12-application-pack
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Install independent PDF parser
        run: python3 -m pip install pypdf==6.10.0
      - name: Verify shared document exporter build
        working-directory: services/document-exporter
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
          git diff --exit-code -- dist/index.js manifest.json
      - name: Verify application file service and limits tests
        working-directory: services/application-files
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
          git diff --exit-code -- dist/index.js manifest.json
          npm test
          cmp dist/index.js ../../components/C12-application-pack/demo/vendor/application-files.js
      - name: Install Chromium
        working-directory: components/C12-application-pack
        run: npx playwright install chromium --only-shell
      - name: Deterministic build
        working-directory: components/C12-application-pack
        run: |
          npm run build
          git diff --exit-code -- dist/index.js manifest.json
      - name: Isolated desktop/mobile tests
        working-directory: components/C12-application-pack
        run: npm test
      - name: Wait for exact public Pages artifact
        working-directory: components/C12-application-pack
        run: |
          expected_hash=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json')).entrypoints.sha256")
          for attempt in $(seq 1 24); do
            if curl -fsSL 'https://programmiererphp.github.io/azubi-rocket-components/components/C12-application-pack/dist/index.js' -o /tmp/component-public.js; then
              actual_hash=$(sha256sum /tmp/component-public.js | cut -d' ' -f1)
              if [ "$actual_hash" = "$expected_hash" ]; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
      - name: Published desktop/mobile tests
        working-directory: components/C12-application-pack
        env:
          REMOTE_BASE_URL: https://programmiererphp.github.io/azubi-rocket-components/components/C12-application-pack/
        run: npm test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C12-browser-evidence
          path: components/C12-application-pack/evidence/
      - name: Commit passing evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/C12-application-pack/evidence/
          git diff --cached --quiet || git commit -m 'Record C12 actual isolated and public browser evidence [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

