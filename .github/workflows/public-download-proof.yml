name: Anonymous public artifact download proof
on:
  push:
    branches: [main]
    paths: ['scripts/verify-public-downloads.py', '.github/workflows/public-download-proof.yml']
  workflow_run:
    workflows: ['C01 isolated and published browser tests','C02 isolated and published browser tests','C03 isolated and published browser tests','C04 isolated and published browser tests','C05 isolated and published browser tests','C06 isolated and published browser tests','C07 isolated and published browser tests','C08 isolated and published browser tests','C09 isolated and published browser tests','C10 isolated and published browser tests','C11 isolated and published browser tests','C12 isolated and published browser tests']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anonymous-artifact-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch artifacts without credentials and verify exact hashes
        run: python3 scripts/verify-public-downloads.py
      - name: Save independent anonymous download receipts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/*/evidence/public-download.json
          git diff --cached --quiet || git commit -m 'Record anonymous exact public artifact downloads [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

